{
  "services": {
    "kafka": {
      "image": "apache/kafka:4.2.1@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0",
      "user": "1000:1000",
      "profiles": [
        "core",
        "full"
      ],
      "networks": [
        "internal"
      ],
      "mem_limit": "1g",
      "cpus": 1,
      "pids_limit": 256,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "15s"
      },
      "stop_grace_period": "30s",
      "environment": {
        "CLUSTER_ID": "${KAFKA_CLUSTER_ID:?Run stack.py init}",
        "KAFKA_NODE_ID": "1",
        "KAFKA_PROCESS_ROLES": "broker,controller",
        "KAFKA_LISTENERS": "PLAINTEXT://:9092,CONTROLLER://:9093",
        "KAFKA_ADVERTISED_LISTENERS": "PLAINTEXT://kafka:9092",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT",
        "KAFKA_CONTROLLER_LISTENER_NAMES": "CONTROLLER",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "PLAINTEXT",
        "KAFKA_CONTROLLER_QUORUM_VOTERS": "1@kafka:9093",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": "1",
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": "1",
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": "1",
        "KAFKA_AUTO_CREATE_TOPICS_ENABLE": "false",
        "KAFKA_LOG_RETENTION_MS": "-1",
        "KAFKA_LOG_RETENTION_BYTES": "-1",
        "KAFKA_LOG_DIRS": "/var/lib/kafka/data",
        "KAFKA_HEAP_OPTS": "-Xms512m -Xmx512m",
        "KAFKA_NUM_PARTITIONS": "1"
      },
      "volumes": [
        "kafka-data:/var/lib/kafka/data"
      ]
    },
    "jobmanager": {
      "image": "flink:2.2.1-scala_2.12-java17@sha256:55ccb2ad4b98362c3f3503c5a6d7cd00b92eb25e38815ddaf0be5903ade54ffe",
      "user": "9999:9999",
      "profiles": [
        "core",
        "full"
      ],
      "networks": [
        "internal"
      ],
      "mem_limit": "1g",
      "cpus": 0.5,
      "pids_limit": 256,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8081/overview >/dev/null"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "15s"
      },
      "stop_grace_period": "30s",
      "command": "jobmanager",
      "environment": {
        "FLINK_PROPERTIES": "jobmanager.rpc.address: jobmanager\njobmanager.memory.process.size: 768m\nstate.checkpoints.dir: file:///state/checkpoints\nstate.savepoints.dir: file:///state/savepoints\nrest.bind-address: 0.0.0.0\nenv.log.dir: /tmp/flink-logs\n",
        "JOB_MANAGER_RPC_ADDRESS": "jobmanager"
      },
      "volumes": [
        "flink-state:/state"
      ]
    },
    "taskmanager": {
      "image": "flink:2.2.1-scala_2.12-java17@sha256:55ccb2ad4b98362c3f3503c5a6d7cd00b92eb25e38815ddaf0be5903ade54ffe",
      "user": "9999:9999",
      "profiles": [
        "core",
        "full"
      ],
      "networks": [
        "internal"
      ],
      "mem_limit": "2g",
      "cpus": 1.5,
      "pids_limit": 256,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl --fail --silent http://jobmanager:8081/taskmanagers | grep -q '\"id\"'"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "15s"
      },
      "stop_grace_period": "30s",
      "command": "taskmanager",
      "environment": {
        "FLINK_PROPERTIES": "jobmanager.rpc.address: jobmanager\ntaskmanager.memory.process.size: 1536m\ntaskmanager.numberOfTaskSlots: 1\nstate.checkpoints.dir: file:///state/checkpoints\nstate.savepoints.dir: file:///state/savepoints\nenv.log.dir: /tmp/flink-logs\n",
        "JOB_MANAGER_RPC_ADDRESS": "jobmanager"
      },
      "volumes": [
        "flink-state:/state"
      ],
      "depends_on": {
        "jobmanager": {
          "condition": "service_healthy"
        }
      }
    },
    "opensearch": {
      "image": "opensearchproject/opensearch:3.9.0@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e",
      "user": "1000:1000",
      "profiles": [
        "full"
      ],
      "networks": [
        "internal",
        "access"
      ],
      "mem_limit": "2g",
      "cpus": 1.5,
      "pids_limit": 256,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl --fail --silent --cacert /usr/share/opensearch/config/ca.pem --config /usr/share/opensearch/config/health.curl \"https://opensearch:9200/_cluster/health?wait_for_status=yellow&timeout=2s\" >/dev/null"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "15s"
      },
      "stop_grace_period": "30s",
      "environment": {
        "DISABLE_INSTALL_DEMO_CONFIG": "true",
        "OPENSEARCH_JAVA_OPTS": "-Xms1g -Xmx1g"
      },
      "ports": [
        "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
      ],
      "volumes": [
        "opensearch-data:/usr/share/opensearch/data",
        "opensearch-config:/usr/share/opensearch/config:ro"
      ],
      "ulimits": {
        "nofile": {
          "soft": 65536,
          "hard": 65536
        }
      }
    }
  },
  "networks": {
    "internal": {
      "internal": true
    },
    "access": {
      "driver": "bridge",
      "driver_opts": {
        "com.docker.network.bridge.host_binding_ipv4": "127.0.0.1"
      }
    }
  },
  "volumes": {
    "kafka-data": {},
    "flink-state": {},
    "opensearch-data": {},
    "opensearch-config": {}
  }
}
