[project]
name = "detectbridge-development"
version = "0.0.0"
requires-python = "==3.12.*"

[tool.uv]
package = false
cache-dir = ".cache/uv"
required-version = "==0.13.6"

[dependency-groups]
dev = ["PyYAML==6.0.3", "jsonschema[format]==4.26.0", "types-jsonschema==4.26.0.20261006", "ruff==0.17.4", "mypy==2.4.1", "types-PyYAML==6.0.12.20250915"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["tools"]
