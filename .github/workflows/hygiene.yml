{
  "name": "Repository hygiene",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "acquire-datasets": {
          "description": "Opt-in network qualification of the four pinned public datasets",
          "type": "boolean",
          "required": false,
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "hygiene-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "classify-changes": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "id": "paths",
          "env": {
            "CHANGE_BASE": "${{ github.event.pull_request.base.sha || github.event.before }}",
            "CHANGE_HEAD": "${{ github.event.pull_request.head.sha || github.sha }}"
          },
          "run": "python3 tools/classify_changes.py"
        }
      ],
      "outputs": {
        "toolchains": "${{ steps.paths.outputs.toolchains }}"
      }
    },
    "repository-hygiene": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.22.3"
          }
        },
        {
          "name": "Install pinned uv",
          "run": "python3 -m pip install uv==0.13.6"
        },
        {
          "run": "uv sync --locked\nnpm install --prefix .cache/npm --ignore-scripts npm@11.19.0\nnode .cache/npm/node_modules/npm/bin/npm-cli.js ci --ignore-scripts\nuv run --locked python tools/install_hygiene.py"
        },
        {
          "run": "uv run --locked python tools/dev.py check"
        }
      ]
    },
    "secret-scan": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "run": "python3 tools/install_hygiene.py --tool gitleaks\npython3 tools/check_repo.py --check secrets"
        }
      ]
    },
    "toolchain-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned uv",
          "run": "python3 -m pip install uv==0.13.6"
        },
        {
          "run": "python3 tools/dev.py bootstrap\npython3 tools/dev.py smoke"
        }
      ],
      "needs": [
        "classify-changes"
      ],
      "if": "${{ needs.classify-changes.outputs.toolchains == 'true' }}"
    },
    "required-checks": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "env": {
            "NEEDS_JSON": "${{ toJSON(needs) }}"
          },
          "run": "python3 tools/check_gate.py"
        }
      ],
      "if": "${{ always() }}",
      "needs": [
        "classify-changes",
        "repository-hygiene",
        "secret-scan",
        "toolchain-verification"
      ]
    },
    "dataset-acquisition": {
      "if": "${{ github.event_name == 'workflow_dispatch' && inputs.acquire-datasets }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked acquisition tooling",
          "run": "python3 -m pip install uv==0.13.6\nuv sync --locked"
        },
        {
          "name": "Acquire, repeat and verify pinned public artifacts",
          "run": "uv run --locked python tools/datasets.py fetch --all\nuv run --locked python tools/datasets.py fetch --all\nuv run --locked python tools/datasets.py verify --all"
        }
      ]
    }
  }
}
