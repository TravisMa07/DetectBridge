{
  "name": "Repository hygiene",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "acquire-datasets": {
          "description": "Opt-in network qualification of the four pinned public datasets",
          "type": "boolean",
          "required": false,
          "default": false
        },
        "qualify-replay": {
          "description": "Opt-in recorded replay qualification using all four pinned datasets",
          "type": "boolean",
          "required": false,
          "default": false
        },
        "qualify-transport": {
          "description": "Opt-in recorded Kafka/Flink transport qualification",
          "type": "boolean",
          "required": false,
          "default": false
        },
        "qualify-writer": {
          "description": "Opt-in recorded OpenSearch writer qualification",
          "type": "boolean",
          "required": false,
          "default": false
        },
        "windows-recipient": {
          "description": "Opt-in real disposable Windows capture: public RSA certificate (DER base64), private key stays local",
          "type": "string",
          "required": false,
          "default": ""
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "hygiene-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "classify-changes": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "id": "paths",
          "env": {
            "CHANGE_BASE": "${{ github.event.pull_request.base.sha || github.event.before }}",
            "CHANGE_HEAD": "${{ github.event.pull_request.head.sha || github.sha }}"
          },
          "run": "python3 tools/classify_changes.py"
        }
      ],
      "outputs": {
        "toolchains": "${{ steps.paths.outputs.toolchains }}",
        "stack": "${{ steps.paths.outputs.stack }}",
        "transport": "${{ steps.paths.outputs.transport }}",
        "detection": "${{ steps.paths.outputs.detection }}",
        "writer": "${{ steps.paths.outputs.writer }}",
        "windows": "${{ steps.paths.outputs.windows }}",
        "linux": "${{ steps.paths.outputs.linux }}",
        "assembly": "${{ steps.paths.outputs.assembly }}",
        "integration": "${{ steps.paths.outputs.integration }}",
        "search": "${{ steps.paths.outputs.search }}",
        "archive": "${{ steps.paths.outputs.archive }}",
        "historical": "${{ steps.paths.outputs.historical }}"
      }
    },
    "repository-hygiene": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.22.3"
          }
        },
        {
          "name": "Install pinned uv",
          "run": "python3 -m pip install uv==0.13.6"
        },
        {
          "run": "uv sync --locked\nnpm install --prefix .cache/npm --ignore-scripts npm@11.19.0\nnode .cache/npm/node_modules/npm/bin/npm-cli.js ci --ignore-scripts\nuv run --locked python tools/install_hygiene.py"
        },
        {
          "run": "uv run --locked python tools/dev.py check"
        }
      ]
    },
    "secret-scan": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "run": "python3 tools/install_hygiene.py --tool gitleaks\npython3 tools/check_repo.py --check secrets"
        }
      ]
    },
    "toolchain-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned uv",
          "run": "python3 -m pip install uv==0.13.6"
        },
        {
          "run": "python3 tools/dev.py bootstrap\npython3 tools/dev.py smoke"
        },
        {
          "name": "Retain bootstrap dependency diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "bootstrap-toolchain-verification",
            "path": ".cache/bootstrap/gradle-help-*/attempt-*.log",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        }
      ],
      "needs": [
        "classify-changes"
      ],
      "if": "${{ needs.classify-changes.outputs.toolchains == 'true' }}"
    },
    "required-checks": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "env": {
            "NEEDS_JSON": "${{ toJSON(needs) }}"
          },
          "run": "python3 tools/check_gate.py"
        }
      ],
      "if": "${{ always() }}",
      "needs": [
        "classify-changes",
        "repository-hygiene",
        "secret-scan",
        "toolchain-verification",
        "local-stack-verification",
        "transport-verification",
        "detection-verification",
        "opensearch-writer-verification",
        "windows-verification",
        "linux-verification",
        "linux-assembly-verification",
        "integration-verification",
        "search-verification",
        "archive-verification",
        "historical-replay-verification"
      ]
    },
    "dataset-acquisition": {
      "if": "${{ github.event_name == 'workflow_dispatch' && inputs.acquire-datasets }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked acquisition tooling",
          "run": "python3 -m pip install uv==0.13.6\nuv sync --locked"
        },
        {
          "name": "Acquire, repeat and verify pinned public artifacts",
          "run": "uv run --locked python tools/datasets.py fetch --all\nuv run --locked python tools/datasets.py fetch --all\nuv run --locked python tools/datasets.py verify --all"
        }
      ]
    },
    "replay-qualification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked acquisition tooling",
          "run": "python3 -m pip install uv==0.13.6\nuv sync --locked"
        },
        {
          "name": "Acquire pinned evidence and qualify isolated replay",
          "run": "uv run --locked python tools/datasets.py fetch --all\nuv run --locked python tools/qualify_replay.py"
        }
      ],
      "if": "${{ github.event_name == 'workflow_dispatch' && inputs.qualify-replay }}"
    },
    "local-stack-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "needs": [
        "classify-changes"
      ],
      "if": "${{ needs.classify-changes.outputs.stack == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked tooling",
          "run": "python3 -m pip install uv==0.13.6\nuv sync --locked"
        },
        {
          "name": "Qualify core and full infrastructure",
          "run": "uv run --locked python tools/stack.py verify --profile core\nuv run --locked python tools/stack.py verify --profile full"
        }
      ]
    },
    "transport-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "needs": [
        "classify-changes"
      ],
      "if": "${{ needs.classify-changes.outputs.transport == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned development tools",
          "run": "python3 -m pip install uv==0.13.6\npython3 tools/dev.py bootstrap"
        },
        {
          "name": "Retain bootstrap dependency diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "bootstrap-transport-verification",
            "path": ".cache/bootstrap/gradle-help-*/attempt-*.log",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Build and qualify checkpointed transport",
          "run": "uv run --locked python tools/transport.py build\nuv run --locked python tools/transport.py verify"
        }
      ]
    },
    "recorded-transport-qualification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "if": "${{ github.event_name == 'workflow_dispatch' && inputs.qualify-transport }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned development tools",
          "run": "python3 -m pip install uv==0.13.6\npython3 tools/dev.py bootstrap"
        },
        {
          "name": "Retain bootstrap dependency diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "bootstrap-recorded-transport-qualification",
            "path": ".cache/bootstrap/gradle-help-*/attempt-*.log",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Build and qualify checkpointed transport",
          "run": "uv run --locked python tools/transport.py build\nuv run --locked python tools/datasets.py fetch --all\nuv run --locked python tools/transport.py verify --recorded"
        }
      ]
    },
    "detection-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "needs": [
        "classify-changes"
      ],
      "if": "${{ needs.classify-changes.outputs.detection == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned development tools",
          "run": "python3 -m pip install uv==0.13.6\npython3 tools/dev.py bootstrap"
        },
        {
          "name": "Retain bootstrap dependency diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "bootstrap-detection-verification",
            "path": ".cache/bootstrap/gradle-help-*/attempt-*.log",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Qualify independent detection semantics and recovery",
          "run": "uv run --locked python tools/detection.py build\nuv run --locked python tools/check_detection.py --java\nuv run --locked python tools/detection.py verify\nuv run --locked python tools/detection.py --mapped build\nuv run --locked python tools/detection.py --mapped verify"
        },
        {
          "name": "Retain synthetic detection recovery diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "detection-recovery-failure-diagnostics",
            "path": ".cache/detection-reports/*.json\n.cache/detection-v2-reports/*.json\n.cache/detection-runtime/*/checkpoint.json\n.cache/detection-v2-runtime/*/checkpoint.json\n.cache/detection-runtime/*/jobs.json\n.cache/detection-v2-runtime/*/jobs.json",
            "include-hidden-files": true,
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    },
    "opensearch-writer-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "needs": [
        "classify-changes"
      ],
      "if": "${{ needs.classify-changes.outputs.writer == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned development tools",
          "run": "python3 -m pip install uv==0.13.6\npython3 tools/dev.py bootstrap"
        },
        {
          "name": "Retain bootstrap dependency diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "bootstrap-opensearch-writer-verification",
            "path": ".cache/bootstrap/gradle-help-*/attempt-*.log",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Build and qualify idempotent OpenSearch writer",
          "run": "uv run --locked python tools/transport.py build\nuv run --locked python tools/writer.py build\nuv run --locked python tools/writer.py verify"
        }
      ]
    },
    "recorded-writer-qualification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "if": "${{ github.event_name == 'workflow_dispatch' && inputs.qualify-writer }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned development tools",
          "run": "python3 -m pip install uv==0.13.6\npython3 tools/dev.py bootstrap"
        },
        {
          "name": "Retain bootstrap dependency diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "bootstrap-recorded-writer-qualification",
            "path": ".cache/bootstrap/gradle-help-*/attempt-*.log",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Build and qualify idempotent OpenSearch writer",
          "run": "uv run --locked python tools/transport.py build\nuv run --locked python tools/writer.py build\nuv run --locked python tools/datasets.py fetch --all\nuv run --locked python tools/writer.py verify --recorded"
        }
      ]
    },
    "windows-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "needs": [
        "classify-changes"
      ],
      "if": "${{ needs.classify-changes.outputs.windows == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned development tools",
          "run": "python3 -m pip install uv==0.13.6\npython3 tools/dev.py bootstrap"
        },
        {
          "name": "Retain bootstrap dependency diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "bootstrap-windows-verification",
            "path": ".cache/bootstrap/gradle-help-*/attempt-*.log",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Build and qualify Windows adapter semantics and offline recovery",
          "run": "uv run --locked python tools/dev.py windows"
        }
      ]
    },
    "linux-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "needs": [
        "classify-changes"
      ],
      "if": "${{ needs.classify-changes.outputs.linux == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned development tools",
          "run": "python3 -m pip install uv==0.13.6\npython3 tools/dev.py bootstrap"
        },
        {
          "name": "Retain bootstrap dependency diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "bootstrap-linux-verification",
            "path": ".cache/bootstrap/gradle-help-*/attempt-*.log",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Build and qualify Linux parser and bounded offline assembly",
          "run": "uv run --locked python tools/dev.py linux"
        }
      ]
    },
    "linux-assembly-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "needs": [
        "classify-changes"
      ],
      "if": "${{ needs.classify-changes.outputs.assembly == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install pinned development tools",
          "run": "python3 -m pip install uv==0.13.6\npython3 tools/dev.py bootstrap"
        },
        {
          "name": "Retain bootstrap dependency diagnostics",
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "bootstrap-linux-assembly-verification",
            "path": ".cache/bootstrap/gradle-help-*/attempt-*.log",
            "include-hidden-files": true,
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Qualify checkpointed Linux assembly and real recovery",
          "run": "uv run --locked python tools/dev.py assembly\nuv run --locked python tools/linux_assembly.py build\nuv run --locked python tools/linux_assembly.py verify"
        }
      ]
    },
    "controlled-windows-recording": {
      "if": "${{ github.event_name == 'workflow_dispatch' && inputs.windows-recipient != '' }}",
      "runs-on": "windows-2022",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Capture native events and encrypt originals",
          "shell": "pwsh",
          "env": {
            "P11_RECIPIENT_CERT": "${{ inputs.windows-recipient }}"
          },
          "run": "./packages/windows-adapters/recording/capture.ps1"
        },
        {
          "name": "Retain encrypted recording only",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "p11-controlled-windows-encrypted",
            "path": "${{ runner.temp }}/detectbridge-p11-sealed/recording.p7m",
            "if-no-files-found": "error",
            "retention-days": 7
          },
          "if": "${{ always() }}"
        }
      ]
    },
    "integration-verification": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
